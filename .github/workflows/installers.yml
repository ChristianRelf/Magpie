name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
          - os: windows-2025
            name: windows-x64
            bundles: nsis
          - os: macos-15
            name: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      # Optional signed updater channel. Blank values produce manual-update builds.
      MAGPIE_UPDATE_PUBLIC_KEY: ${{ vars.MAGPIE_UPDATE_PUBLIC_KEY }}
      MAGPIE_UPDATE_URL: ${{ vars.MAGPIE_UPDATE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb xdotool x11-apps
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @magpie/desktop tauri build --bundles ${{ matrix.bundles }}
      - run: cargo build --release -p magpie --locked
      - name: Test native platform
        run: cargo test --workspace --locked
      - name: Lifecycle smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export MAGPIE_TEST_BINARY=target/release/magpie.exe
            export MAGPIE_TEST_DESKTOP=target/release/magpie-desktop.exe
          else
            export MAGPIE_TEST_BINARY=target/release/magpie
            export MAGPIE_TEST_DESKTOP=target/release/magpie-desktop
          fi
          node scripts/lifecycle-test.mjs
      - name: Native window and background opt-in
        if: runner.os == 'Linux'
        env:
          MAGPIE_TEST_BINARY: target/release/magpie
          MAGPIE_TEST_DESKTOP: target/release/magpie-desktop
          MAGPIE_TEST_SCREENSHOT: apps/desktop/test-results/native.png
          NO_AT_BRIDGE: 1
          GTK_USE_PORTAL: 0
        run: dbus-run-session --config-file=scripts/headless-session.conf -- python3 scripts/native-window-test.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: magpie-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/magpie
            target/release/magpie.exe
          retention-days: 14
