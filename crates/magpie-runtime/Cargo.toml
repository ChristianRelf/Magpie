[package]
name = "magpie-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
magpie-api = { version = "0.1.2", path = "../magpie-api" }
magpie-core = { version = "0.1.2", path = "../magpie-core" }
magpie-engine = { version = "0.1.2", path = "../magpie-engine" }
magpie-providers = { version = "0.1.2", path = "../magpie-providers" }
magpie-security = { version = "0.1.2", path = "../magpie-security" }
magpie-store = { version = "0.1.2", path = "../magpie-store" }
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
