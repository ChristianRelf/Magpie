[package]
name = "magpie-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
futures = "0.3.34"
magpie-core = { version = "0.1.3", path = "../magpie-core" }
magpie-engine = { version = "0.1.3", path = "../magpie-engine" }
magpie-providers = { version = "0.1.3", path = "../magpie-providers" }
magpie-security = { version = "0.1.3", path = "../magpie-security" }
magpie-store = { version = "0.1.3", path = "../magpie-store" }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
uuid = "1.20.0"

[dev-dependencies]
magpie-providers = { path = "../magpie-providers", features = ["testing"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream"] }
uuid = { version = "1.20.0", features = ["v4"] }
