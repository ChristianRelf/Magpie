[package]
name = "magpie-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
magpie-core = { version = "0.1.0", path = "../magpie-core" }
magpie-security = { version = "0.1.0", path = "../magpie-security" }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream", "http2", "system-proxy"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = "1.20.0"
which = "8.0.6"

[features]
testing = []
