[workspace]
resolver = "2"
members = [
  "crates/magpie-core",
  "crates/magpie-store",
  "crates/magpie-security",
  "crates/magpie-providers",
  "crates/magpie-router",
  "crates/magpie-engine",
  "crates/magpie-api",
  "crates/magpie-runtime",
  "apps/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Christian Relf"]
repository = "https://github.com/christianrelf/magpie"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
