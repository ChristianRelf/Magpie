[package]
name = "magpie"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive", "env"] }
futures = "0.3.34"
magpie-core = { version = "0.1.2", path = "../../crates/magpie-core" }
magpie-runtime = { version = "0.1.2", path = "../../crates/magpie-runtime" }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
