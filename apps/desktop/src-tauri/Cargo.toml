[package]
name = "magpie-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
magpie-core = { path = "../../../crates/magpie-core" }
magpie-runtime = { path = "../../../crates/magpie-runtime" }
magpie-store = { path = "../../../crates/magpie-store" }
magpie-providers = { path = "../../../crates/magpie-providers" }
magpie-security = { path = "../../../crates/magpie-security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
